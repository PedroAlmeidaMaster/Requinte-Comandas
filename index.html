<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Requinte Café · Comandas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --red:#7A2331;
    --red-dark:#5A1A24;
    --cream:#FBF2E4;
    --cream-soft:#F3E6D0;
    --gold:#B7853E;
    --gold-soft:#E4CE9C;
    --ink:#2B2118;
    --ink-soft:#7A6B58;
    --olive:#6E7B4E;
    --olive-soft:#E4E8D6;
    --brick:#A6473B;
    --brick-soft:#F3DCD8;
    --radius:14px;
    --shadow:0 2px 10px rgba(90,26,36,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header.top{
    padding:18px 20px 14px;
    background:var(--red);
    color:var(--cream);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  header.top .brand{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.2px;
  }
  header.top .brand span{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:11.5px;
    letter-spacing:0.4px;
    color:var(--gold-soft);
    margin-top:2px;
  }
  header.top button.reset{
    background:none;
    border:1px solid rgba(251,242,228,0.35);
    color:var(--cream);
    font-size:11px;
    padding:6px 10px;
    border-radius:20px;
    font-family:'Inter',sans-serif;
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 90px;
  }
  nav.bottom{
    position:sticky;
    bottom:0;
    display:flex;
    background:#fff;
    border-top:1px solid var(--cream-soft);
    box-shadow:0 -2px 10px rgba(90,26,36,0.08);
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    padding:11px 4px 9px;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  nav.bottom button .ic{font-size:19px;}
  nav.bottom button.active{color:var(--red);}
  nav.bottom button.active .dot{width:4px;height:4px;border-radius:50%;background:var(--red);margin-top:1px;}
  nav.bottom button .dot{width:4px;height:4px;margin-top:1px;}

  h2.section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:2px 0 14px;
    color:var(--red-dark);
  }
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty .big{font-size:34px;margin-bottom:10px;}
  .empty p{font-size:13.5px;line-height:1.5;margin:6px 0 0;}

  /* pedido cards */
  .comanda-card{
    background:#fff;
    border-radius:var(--radius);
    padding:14px 15px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    border:1px solid var(--cream-soft);
  }
  .comanda-card .row1{display:flex;justify-content:space-between;align-items:flex-start;}
  .comanda-card .cliente{font-weight:700;font-size:15px;}
  .comanda-card .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .comanda-card .total{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--red);}
  .comanda-card .itens-resumo{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .badge-time{
    display:inline-block;
    font-size:10.5px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    margin-top:6px;
  }
  .badge-ok{background:var(--olive-soft);color:var(--olive);}
  .badge-warn{background:var(--brick-soft);color:var(--brick);}

  /* form */
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;}
  input[type=text]{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--cream-soft);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    margin-bottom:16px;
  }
  input[type=text]:focus{outline:none;border-color:var(--gold);}

  .cat-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:12px;
    border-bottom:1px solid var(--cream-soft);
  }
  .cat-tabs button{
    flex:none;
    background:var(--cream-soft);
    border:none;
    padding:8px 14px;
    border-radius:20px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .cat-tabs button.active{background:var(--red);color:var(--cream);}

  .item-grid{display:flex;flex-direction:column;gap:8px;}
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--cream-soft);
    border-radius:12px;
    padding:11px 12px;
  }
  .item-row .info{flex:1;padding-right:10px;}
  .item-row .name{font-size:13.5px;font-weight:600;line-height:1.3;}
  .item-row .price{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{
    width:30px;height:30px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    background:#fff;
    color:var(--red-dark);
    font-size:16px;
    font-weight:700;
    line-height:1;
  }
  .stepper button.add{background:var(--gold);color:#fff;border-color:var(--gold);}
  .stepper .qty{min-width:16px;text-align:center;font-weight:700;font-size:14px;}

  .cart-bar{
    position:sticky;
    bottom:0;
    background:var(--red);
    color:var(--cream);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    box-shadow:0 4px 14px rgba(90,26,36,0.25);
  }
  .cart-bar .cb-info{font-size:12.5px;}
  .cart-bar .cb-total{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .cart-bar button.primary{
    background:var(--gold);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:22px;
    font-weight:700;
    font-size:13px;
    font-family:'Inter',sans-serif;
  }
  .cart-bar button.primary:disabled{opacity:0.5;}

  .backbtn{
    background:none;border:none;color:var(--red);font-weight:600;font-size:13px;
    padding:0 0 14px;display:flex;align-items:center;gap:4px;
  }

  .detail-head{
    background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .detail-head .cliente{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--red-dark);}
  .detail-head .meta{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .itens-list{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;}
  .itens-list .li{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 15px;border-bottom:1px solid var(--cream-soft);
  }
  .itens-list .li:last-child{border-bottom:none;}
  .itens-list .li .nm{font-size:13.5px;font-weight:600;}
  .itens-list .li .sub{font-size:11.5px;color:var(--ink-soft);}
  .itens-list .li .val{font-weight:700;font-size:13.5px;}

  .total-line{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;background:var(--cream-soft);border-radius:var(--radius);margin-bottom:16px;
  }
  .total-line .lbl{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .total-line .val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--red-dark);}

  .btn-block{
    width:100%;padding:13px;border-radius:12px;border:none;
    font-family:'Inter',sans-serif;font-weight:700;font-size:14px;margin-bottom:10px;
  }
  .btn-primary{background:var(--red);color:#fff;}
  .btn-secondary{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn-danger{background:none;color:var(--brick);border:none;font-size:12.5px;font-weight:600;padding:6px;}

  .pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .pay-grid button{
    padding:13px 8px;border-radius:12px;border:1.5px solid var(--cream-soft);background:#fff;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink);
  }
  .pay-grid button.sel{background:var(--red);border-color:var(--red);color:#fff;}

  /* caixa */
  .date-picker{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .date-picker button{
    background:var(--cream-soft);border:none;width:34px;height:34px;border-radius:50%;font-size:15px;font-weight:700;color:var(--red-dark);
  }
  .date-picker .lbl{flex:1;text-align:center;font-weight:700;font-size:14px;}

  .resumo-total{
    background:var(--red);color:var(--cream);border-radius:var(--radius);padding:18px;margin-bottom:16px;text-align:center;
  }
  .resumo-total .lbl{font-size:11.5px;letter-spacing:0.3px;color:var(--gold-soft);font-weight:600;}
  .resumo-total .val{font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin-top:4px;}
  .resumo-total .sub{font-size:11.5px;color:var(--cream);opacity:0.75;margin-top:4px;}

  .pay-summary{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
  .pay-summary .pl{
    display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--cream-soft);font-size:13.5px;
  }
  .pay-summary .pl:last-child{border-bottom:none;}
  .pay-summary .pl .nm{font-weight:600;color:var(--ink-soft);}
  .pay-summary .pl .vl{font-weight:700;}

  .toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
  }
  .toast.show{opacity:0.94;}

  #confirmOverlay{
    position:fixed;inset:0;background:rgba(43,33,24,0.45);display:none;align-items:flex-end;justify-content:center;z-index:60;
  }
  #confirmOverlay.show{display:flex;}
  #confirmOverlay .sheet{
    background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px;
  }

  /* caixa: comandas fechadas expansíveis (mesmos tokens visuais já usados) */
  .caixa-comanda{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
  .caixa-comanda .li{border-bottom:none;}
  .caixa-comanda .detail{padding:0 15px 14px;border-top:1px solid var(--cream-soft);}
  .caixa-comanda .detail .meta{font-size:12px;color:var(--ink-soft);margin:10px 0 8px;line-height:1.5;}
  .caixa-comanda .detail .itens-list{box-shadow:none;border:1px solid var(--cream-soft);margin-bottom:0;}
  .caixa-comanda .detail .total-line{margin-top:10px;margin-bottom:0;}

  /* relatório: impressão nativa, não afeta a tela normal */
  #printArea{display:none;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;padding:20px;font-family:'Inter',sans-serif;color:#2B2118;}
    #printArea h2{font-family:'Fraunces',serif;margin-bottom:2px;}
    #printArea table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:12.5px;}
    #printArea th,#printArea td{text-align:left;padding:4px 6px;border-bottom:1px solid #ddd;}
    #printArea h3{margin:16px 0 4px;font-size:14px;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Requinte<span>COMANDAS · CAIXA</span></div>
    <button class="reset" id="resetBtn">Zerar dados</button>
  </header>

  <main id="main"></main>

  <nav class="bottom">
    <button data-view="pedidos"><span class="ic">☕</span>Pedidos<span class="dot"></span></button>
    <button data-view="novo"><span class="ic">＋</span>Novo pedido<span class="dot"></span></button>
    <button data-view="caixa"><span class="ic">▤</span>Caixa<span class="dot"></span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div id="confirmOverlay"><div class="sheet" id="confirmSheet"></div></div>
<div id="printArea"></div>


<script>
/* ================= DADOS DO CARDÁPIO ================= */
const MENU = [
  {cat:"Café", name:"Expresso", price:7},
  {cat:"Café", name:"Cappuccino", price:8},
  {cat:"Especiais", name:"Coffetto", price:18},
  {cat:"Especiais", name:"Cappuccino Marasca", price:15},
  {cat:"Especiais", name:"Café Maraschino", price:20},
  {cat:"Especiais", name:"Affogato", price:25},
  {cat:"Especiais", name:"Café com Nutella", price:15},
  {cat:"Bebidas", name:"Água sem gás", price:4},
  {cat:"Bebidas", name:"Água com gás", price:5},
  {cat:"Bebidas", name:"Coca Cola lata", price:7},
  {cat:"Bebidas", name:"Coca Cola Zero lata", price:7},
  {cat:"Bebidas", name:"Guaraná lata", price:7},
  {cat:"Bebidas", name:"Guaraná Zero lata", price:7},
  {cat:"Bebidas", name:"São Geraldo - Cajuína", price:7},
  {cat:"Bebidas", name:"São Geraldo - Cajuína Zero", price:7},
  {cat:"Bebidas", name:"Chá mate gelado", price:7},
  {cat:"Bebidas", name:"Suco laranja/abacaxi-hortelã", price:12},
  {cat:"Bebidas", name:"Suco cajá/acerola", price:10},
  {cat:"Bolos", name:"Bolo de chocolate", price:15},
  {cat:"Bolos", name:"Rocambole de chocolate", price:17},
  {cat:"Bolos", name:"Bolo de ameixas", price:18},
  {cat:"Bolos", name:"Bolo de laranja", price:8},
  {cat:"Bolos", name:"Bolo tapioca", price:17},
  {cat:"Salgados", name:"Coxinha de frango", price:10},
  {cat:"Salgados", name:"Empada de frango", price:12},
  {cat:"Salgados", name:"Empada de carne de sol e banana", price:13},
  {cat:"Salgados", name:"Quiche de frango e alho poró", price:15},
  {cat:"Salgados", name:"Quiche de gorgonzola e abacaxi", price:15},
  {cat:"Salgados", name:"Pastel de forno", price:13},
  {cat:"Salgados", name:"Pão na chapa", price:10},
  {cat:"Salgados", name:"Croissant recheado com frango", price:15},
  {cat:"Salgados", name:"Croissant recheado com carne de sol", price:18},
  {cat:"Salgados", name:"Tapioca recheada com frango", price:17},
  {cat:"Salgados", name:"Tapioca recheada com carne de sol", price:18},
  {cat:"Salgados", name:"Cuscuz com frango", price:17},
  {cat:"Salgados", name:"Cuscuz com carne de sol", price:19},
];
const CATS = ["Café","Especiais","Bebidas","Bolos","Salgados"];
const PAYMENTS = ["Dinheiro","Crédito","Débito","Pix","Convênio diretoria","Folha de pagamento","Reuniões autorizadas"];
const STORAGE_KEY = "requinte_comandas";

/* ================= ESTADO ================= */
let comandas = [];
let view = "pedidos";
let novoCliente = "";
let novoCart = {}; // name -> qty (para o formulário de novo pedido)
let novoCatAtiva = CATS[0];
let detalheId = null;
let detalheCatAtiva = CATS[0];
let caixaData = new Date().toISOString().slice(0,10);
let caixaPagamentoFiltro = null;
let caixaSubView = "diario"; // "diario" | "mensal"
let caixaExpandidoId = null; // id da comanda fechada expandida na lista
let caixaMes = new Date().getMonth()+1; // 1-12
let caixaAno = new Date().getFullYear();
let relatorioAtivo = null; // { tipo:"diario", data:"YYYY-MM-DD" } ou { tipo:"mensal", mes, ano }
let loaded = false;

/* ================= STORAGE ================= */
async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    comandas = raw ? JSON.parse(raw) : [];
  }catch(e){
    comandas = [];
  }
  loaded = true;
  render();
}
async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(comandas));
  }catch(e){
    showToast("Erro ao salvar. Verifique o espaço de armazenamento do navegador.");
  }
}

/* ================= HELPERS ================= */
function money(v){ return "R$ " + v.toFixed(2).replace(".", ","); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function comandaTotal(c){ return c.items.reduce((s,i)=>s+i.price*i.qty,0); }
function cartTotal(){ return Object.entries(novoCart).reduce((s,[n,q])=>{
  const it = MENU.find(m=>m.name===n); return s + (it? it.price*q : 0);
},0); }
function cartCount(){ return Object.values(novoCart).reduce((a,b)=>a+b,0); }
function minutosAberta(c){ return Math.floor((Date.now() - new Date(c.createdAt).getTime())/60000); }
function dadosDoDia(dateStr){
  const fechadas = comandas.filter(c=>c.status==="fechada" && (c.closedAt||"").slice(0,10)===dateStr)
    .sort((a,b)=>new Date(a.closedAt)-new Date(b.closedAt));
  const total = fechadas.reduce((s,c)=>s+comandaTotal(c),0);
  const porPagamento = {};
  PAYMENTS.forEach(p=>porPagamento[p]=0);
  fechadas.forEach(c=>{ porPagamento[c.paymentMethod] = (porPagamento[c.paymentMethod]||0) + comandaTotal(c); });
  return {fechadas, total, porPagamento};
}
function dadosDoMes(ano, mes){
  const prefix = `${ano}-${String(mes).padStart(2,"0")}`;
  const fechadas = comandas.filter(c=>c.status==="fechada" && (c.closedAt||"").startsWith(prefix));
  const total = fechadas.reduce((s,c)=>s+comandaTotal(c),0);
  const porPagamento = {};
  PAYMENTS.forEach(p=>porPagamento[p]=0);
  fechadas.forEach(c=>{ porPagamento[c.paymentMethod] = (porPagamento[c.paymentMethod]||0) + comandaTotal(c); });
  const porDia = {};
  fechadas.forEach(c=>{
    const d = c.closedAt.slice(0,10);
    if(!porDia[d]) porDia[d] = {count:0,total:0};
    porDia[d].count += 1;
    porDia[d].total += comandaTotal(c);
  });
  const dias = Object.keys(porDia).sort().map(d=>({data:d, count:porDia[d].count, total:porDia[d].total}));
  return {fechadas, total, porPagamento, dias, ticketMedio: fechadas.length ? total/fechadas.length : 0};
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function fmtDataLabel(iso){
  const d = new Date(iso + "T12:00:00");
  const hoje = new Date().toISOString().slice(0,10);
  const ontem = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(iso===hoje) return "Hoje";
  if(iso===ontem) return "Ontem";
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
}

/* ================= NAV ================= */
document.querySelectorAll("nav.bottom button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    view = btn.dataset.view;
    detalheId = null;
    render();
  });
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  openConfirm(
    "Zerar todos os dados?",
    "Isso apaga todas as comandas abertas e o histórico de caixa salvo neste app. Essa ação não pode ser desfeita.",
    "Zerar tudo", async ()=>{
      comandas = [];
      await saveData();
      closeConfirm();
      render();
    }
  );
});

function openConfirm(title, desc, actionLabel, onConfirm){
  const sheet = document.getElementById("confirmSheet");
  sheet.innerHTML = `
    <div style="font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin-bottom:8px;color:var(--red-dark)">${title}</div>
    <div style="font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:18px">${desc}</div>
    <button class="btn-block btn-primary" id="confirmYes">${actionLabel}</button>
    <button class="btn-block btn-secondary" id="confirmNo">Cancelar</button>
  `;
  document.getElementById("confirmOverlay").classList.add("show");
  document.getElementById("confirmYes").onclick = onConfirm;
  document.getElementById("confirmNo").onclick = closeConfirm;
}
function closeConfirm(){ document.getElementById("confirmOverlay").classList.remove("show"); }

/* ================= RENDER ROOT ================= */
function render(){
  document.querySelectorAll("nav.bottom button").forEach(b=>{
    b.classList.toggle("active", b.dataset.view===view);
  });
  const main = document.getElementById("main");
  if(!loaded){ main.innerHTML = `<div class="empty"><div class="big">☕</div><p>Carregando comandas…</p></div>`; return; }
  if(view==="pedidos") main.innerHTML = renderPedidos();
  else if(view==="novo") main.innerHTML = renderNovo();
  else if(view==="detalhe") main.innerHTML = renderDetalhe();
  else if(view==="caixa") main.innerHTML = renderCaixa();
  else if(view==="relatorio") main.innerHTML = renderRelatorio();
  attachHandlers();
}

/* ================= VIEW: PEDIDOS (abertas) ================= */
function renderPedidos(){
  const abertas = comandas.filter(c=>c.status==="aberta").sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  if(abertas.length===0){
    return `<h2 class="section-title">Pedidos em aberto</h2>
      <div class="empty">
        <div class="big">🧾</div>
        <p>Nenhuma comanda aberta agora.<br>Toque em "Novo pedido" para lançar o primeiro cliente do dia.</p>
      </div>`;
  }
  return `<h2 class="section-title">Pedidos em aberto (${abertas.length})</h2>` +
    abertas.map(c=>{
      const mins = minutosAberta(c);
      const badge = mins>=20 ? `<span class="badge-time badge-warn">${mins} min na mesa</span>` : `<span class="badge-time badge-ok">${mins} min</span>`;
      const resumo = c.items.slice(0,3).map(i=>`${i.qty}× ${i.name}`).join(", ") + (c.items.length>3? "…" : "");
      return `<div class="comanda-card" data-open="${c.id}">
        <div class="row1">
          <div>
            <div class="cliente">${escapeHtml(c.cliente)}</div>
            <div class="meta">${c.items.length} ${c.items.length===1?"item":"itens"}</div>
          </div>
          <div class="total">${money(comandaTotal(c))}</div>
        </div>
        <div class="itens-resumo">${resumo || "Sem itens ainda"}</div>
        ${badge}
      </div>`;
    }).join("");
}

/* ================= VIEW: NOVO PEDIDO ================= */

    <input type="text" id="clienteInput" placeholder="Ex: Mesa 4, João, Sala reunião..." value="${escapeAttr(novoCliente)}">

    <label>Itens</label>
    <div class="cat-tabs">
      ${CATS.map(c=>`<button data-catnovo="${c}" class="${c===novoCatAtiva?'active':''}">${c}</button>`).join("")}
    </div>
    <div class="item-grid">
      ${itensCat.map(it=>{
        const q = novoCart[it.name]||0;
        return `<div class="item-row">
          <div class="info">
            <div class="name">${it.name}</div>
            <div class="price">${money(it.price)}</div>

/* ================= VIEW: CAIXA (fechamento do dia + relatórios) ================= */
function renderCaixa(){
  const subTabs = `
    <div class="cat-tabs">
      <button data-caixasub="diario" class="${caixaSubView==="diario"?'active':''}">Diário</button>
      <button data-caixasub="mensal" class="${caixaSubView==="mensal"?'active':''}">Mensal</button>
    </div>`;

  if(caixaSubView==="mensal") return `<h2 class="section-title">Fechamento de caixa</h2>${subTabs}${renderCaixaMensal()}`;
  return `<h2 class="section-title">Fechamento de caixa</h2>${subTabs}${renderCaixaDiario()}`;
}

    : fechadas;

  return `
    <div class="date-picker">
      <button id="diaAnterior">‹</button>

      <button id="diaSeguinte">›</button>
    </div>
    <input type="date" id="dataInput" value="${caixaData}" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;">

    <div class="resumo-total">
      <div class="lbl">RECEITA TOTAL DO DIA</div>
      <div class="val">${money(total)}</div>
      <div class="sub">${fechadas.length} comanda${fechadas.length===1?"":"s"} fechada${fechadas.length===1?"":"s"}</div>
    </div>

    <label>Por forma de pagamento</label>
    <div class="pay-summary">
      ${PAYMENTS.map(p=>`
        <div class="pl" data-filterpay="${escapeAttr(p)}" style="cursor:pointer;${caixaPagamentoFiltro===p?'background:var(--cream-soft)':''}">
          <div class="nm">${p}</div>
          <div class="vl">${money(porPagamento[p]||0)}</div>
        </div>`).join("")}

    ${caixaPagamentoFiltro?`<button class="btn-danger" id="limparFiltroPay" style="margin-bottom:10px">Limpar filtro (${caixaPagamentoFiltro})</button>`:""}

    <label>Comandas fechadas</label>
    ${listaFiltrada.length===0? `<div class="empty" style="padding:24px 10px"><p>Nenhuma comanda fechada nesta data${caixaPagamentoFiltro? " para "+caixaPagamentoFiltro:""}.</p></div>` :

}

function renderCaixaComandaCard(c){
  const aberto = caixaExpandidoId===c.id;

  const horaAbertura = new Date(c.createdAt).toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'});
  return `
    <div class="caixa-comanda">
      <div class="li" data-toggleclosed="${c.id}" style="cursor:pointer">
        <div>
          <div class="nm">${escapeHtml(c.cliente)} <span style="color:var(--ink-soft);font-weight:400">${aberto?'▾':'▸'}</span></div>
          <div class="sub">Fechada às ${horaFechamento} · ${c.paymentMethod}</div>
        </div>
        <div class="val">${money(comandaTotal(c))}</div>
      </div>
      ${aberto? `
      <div class="detail">
        <div class="meta">Abertura: ${horaAbertura} &nbsp;·&nbsp; Fechamento: ${horaFechamento}<br>Pagamento: ${c.paymentMethod}</div>
        <div class="itens-list">
          ${c.items.map(i=>`
            <div class="li">
              <div><div class="nm">${i.name}</div><div class="sub">${i.qty} × ${money(i.price)}</div></div>
              <div class="val">${money(i.qty*i.price)}</div>
            </div>`).join("")}
        </div>
        <div class="total-line"><div class="lbl">Total</div><div class="val">${money(comandaTotal(c))}</div></div>
      </div>` : ""}
    </div>`;
}

/* ================= VIEW: VISUALIZAÇÃO DO RELATÓRIO (tela intermediária, antes de imprimir) ================= */
function renderRelatorio(){
  if(!relatorioAtivo){ view="caixa"; return renderCaixa(); }
  return relatorioAtivo.tipo==="mensal"
    ? renderRelatorioMensal(relatorioAtivo.ano, relatorioAtivo.mes)
    : renderRelatorioDiario(relatorioAtivo.data);
}

/* ================= HANDLERS ================= */
function attachHandlers(){
  // abrir detalhe
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=>{ detalheId = el.dataset.open; detalheCatAtiva = CATS[0]; view="detalhe"; render(); });
  });
  const back = document.querySelector("[data-back]");
  if(back) back.addEventListener("click", ()=>{ view="pedidos"; render(); });

  // ---- NOVO PEDIDO ----
  const clienteInput = document.getElementById("clienteInput");
  if(clienteInput){
    clienteInput.addEventListener("input", (e)=>{ novoCliente = e.target.value; refreshCartBar(); });
  }
  document.querySelectorAll("[data-catnovo]").forEach(el=>{
    el.addEventListener("click", ()=>{ novoCatAtiva = el.dataset.catnovo; render(); focusClienteAfter(); });
  });
  document.querySelectorAll("[data-inc]").forEach(el=>{
    el.addEventListener("click", ()=>{ const n=el.dataset.inc; novoCart[n]=(novoCart[n]||0)+1; render(); focusClienteAfter(); });
  });
  document.querySelectorAll("[data-dec]").forEach(el=>{
    el.addEventListener("click", ()=>{ const n=el.dataset.dec; novoCart[n]=Math.max(0,(novoCart[n]||0)-1); if(novoCart[n]===0) delete novoCart[n]; render(); focusClienteAfter(); });
  });
  const abrirBtn = document.getElementById("abrirComandaBtn");
  if(abrirBtn) abrirBtn.addEventListener("click", async ()=>{
    if(cartCount()===0 || novoCliente.trim()==="") return;
    const items = Object.entries(novoCart).map(([name,qty])=>{
      const it = MENU.find(m=>m.name===name);
      return {name, qty, price: it.price};
    });
    const nova = { id: uid(), cliente: novoCliente.trim(), items, status:"aberta", paymentMethod:null, createdAt:new Date().toISOString(), closedAt:null };
    comandas.push(nova);
    await saveData();
    novoCliente=""; novoCart={}; novoCatAtiva=CATS[0];
    detalheId = nova.id; view="detalhe"; detalheCatAtiva=CATS[0];
    showToast("Comanda aberta");
    render();
  });

  // ---- DETALHE ----
  document.querySelectorAll("[data-catdet]").forEach(el=>{
    el.addEventListener("click", ()=>{ detalheCatAtiva = el.dataset.catdet; render(); });
  });
  document.querySelectorAll("[data-additem]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const c = comandas.find(x=>x.id===detalheId);
      const menuItem = MENU.find(m=>m.name===el.dataset.additem);
      const existing = c.items.find(i=>i.name===menuItem.name);
      if(existing) existing.qty += 1;
      else c.items.push({name:menuItem.name, qty:1, price:menuItem.price});
      await saveData();
      render();
    });
  });
  document.querySelectorAll("[data-decitem]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const c = comandas.find(x=>x.id===detalheId);
      const existing = c.items.find(i=>i.name===el.dataset.decitem);
      if(!existing) return;
      if(existing.qty > 1) existing.qty -= 1;
      else c.items = c.items.filter(i=>i.name!==el.dataset.decitem);
      await saveData();
      render();
    });
  });
  const fecharBtn = document.getElementById("fecharComandaBtn");
  if(fecharBtn) fecharBtn.addEventListener("click", ()=>{
    const c = comandas.find(x=>x.id===detalheId);
    openPaymentSheet(c);
  });
  const cancelarBtn = document.getElementById("cancelarComandaBtn");
  if(cancelarBtn) cancelarBtn.addEventListener("click", ()=>{
    openConfirm("Cancelar esta comanda?", "A comanda e os itens lançados serão apagados.", "Cancelar comanda", async ()=>{
      comandas = comandas.filter(c=>c.id!==detalheId);
      await saveData();
      closeConfirm();
      view="pedidos"; render();
    });
  });

  // ---- CAIXA ----
  document.querySelectorAll("[data-caixasub]").forEach(el=>{
    el.addEventListener("click", ()=>{ caixaSubView = el.dataset.caixasub; caixaExpandidoId=null; render(); });
  });
  const prev = document.getElementById("diaAnterior");
  const next = document.getElementById("diaSeguinte");
  if(prev) prev.addEventListener("click", ()=>{ caixaData = new Date(new Date(caixaData+"T12:00:00").getTime()-86400000).toISOString().slice(0,10); caixaPagamentoFiltro=null; caixaExpandidoId=null; render(); });
  if(next) next.addEventListener("click", ()=>{ caixaData = new Date(new Date(caixaData+"T12:00:00").getTime()+86400000).toISOString().slice(0,10); caixaPagamentoFiltro=null; caixaExpandidoId=null; render(); });
  const dataLbl = document.getElementById("dataLbl");
  const dataInput = document.getElementById("dataInput");
  if(dataLbl && dataInput) dataLbl.addEventListener("click", ()=>{ if(dataInput.showPicker) dataInput.showPicker(); else dataInput.click(); });
  if(dataInput) dataInput.addEventListener("change", (e)=>{ if(e.target.value){ caixaData = e.target.value; caixaPagamentoFiltro=null; caixaExpandidoId=null; render(); } });
  document.querySelectorAll("[data-filterpay]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const p = el.dataset.filterpay;
      caixaPagamentoFiltro = (caixaPagamentoFiltro===p) ? null : p;
      render();
    });
  });
  const limparFiltro = document.getElementById("limparFiltroPay");
  if(limparFiltro) limparFiltro.addEventListener("click", ()=>{ caixaPagamentoFiltro=null; render(); });
  document.querySelectorAll("[data-toggleclosed]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.toggleclosed;
      caixaExpandidoId = (caixaExpandidoId===id) ? null : id;
      render();
    });
  });
  const gerarRelatorioBtn = document.getElementById("gerarRelatorioBtn");
  if(gerarRelatorioBtn) gerarRelatorioBtn.addEventListener("click", ()=>{
    relatorioAtivo = {tipo:"diario", data:caixaData};
    view = "relatorio";
    render();
  });
  const mesAnterior = document.getElementById("mesAnterior");
  const mesSeguinte = document.getElementById("mesSeguinte");
  if(mesAnterior) mesAnterior.addEventListener("click", ()=>{ caixaMes -= 1; if(caixaMes<1){ caixaMes=12; caixaAno-=1; } render(); });
  if(mesSeguinte) mesSeguinte.addEventListener("click", ()=>{ caixaMes += 1; if(caixaMes>12){ caixaMes=1; caixaAno+=1; } render(); });
  const gerarRelatorioMensalBtn = document.getElementById("gerarRelatorioMensalBtn");
  if(gerarRelatorioMensalBtn) gerarRelatorioMensalBtn.addEventListener("click", ()=>{
    relatorioAtivo = {tipo:"mensal", mes:caixaMes, ano:caixaAno};
    view = "relatorio";
    render();
  });

  // ---- RELATÓRIO (visualização, separado da impressão) ----
  const voltarCaixaBtn = document.getElementById("voltarCaixaBtn");
  if(voltarCaixaBtn) voltarCaixaBtn.addEventListener("click", ()=>{
    relatorioAtivo = null;
    view = "caixa";
    render();
  });
  const imprimirRelatorioBtn = document.getElementById("imprimirRelatorioBtn");
  if(imprimirRelatorioBtn) imprimirRelatorioBtn.addEventListener("click", ()=>{ imprimirRelatorioAtivo(); });
}

/* ================= IMPRESSÃO (somente ao clicar em "Imprimir / Salvar PDF") ================= */
function construirRelatorioDiarioImpressao(dateStr){
  const {fechadas, total, porPagamento} = dadosDoDia(dateStr);
  const dataFmt = new Date(dateStr+"T12:00:00").toLocaleDateString("pt-BR",{day:'2-digit',month:'2-digit',year:'numeric'});
  const resumoPagHtml = PAYMENTS.map(p=>`<tr><td>${p}</td><td>${money(porPagamento[p]||0)}</td></tr>`).join("");
  const movimentacaoHtml = fechadas.length===0 ? "<p>Nenhuma comanda fechada no período.</p>" : `
    <table>
      <tr><th>Cliente</th><th>Valor</th><th>Forma de Pagamento</th></tr>
      ${fechadas.map(c=>`<tr><td>${escapeHtml(c.cliente)}</td><td>${money(comandaTotal(c))}</td><td>${c.paymentMethod}</td></tr>`).join("")}
    </table>`;

  return `
    <h2>Requinte Café</h2>
    <p><strong>Fechamento de Caixa</strong><br>${dataFmt}</p>
    <h3>Movimentação do dia</h3>
    ${movimentacaoHtml}
    <h3>Resumo do caixa</h3>
    <table><tr><th>Forma de Pagamento</th><th>Receita Recebida</th></tr>${resumoPagHtml}</table>
    <p><strong>Receita total: ${money(total)}</strong></p>
  `;
}

function construirRelatorioMensalImpressao(ano, mes){
  const {fechadas, total, porPagamento, dias, ticketMedio} = dadosDoMes(ano, mes);
  const labelMes = new Date(ano, mes-1, 1).toLocaleDateString("pt-BR",{month:"long", year:"numeric"});
  const resumoPagHtml = PAYMENTS.map(p=>`<tr><td>${p}</td><td>${money(porPagamento[p]||0)}</td></tr>`).join("");
  const diasHtml = dias.length===0 ? "<p>Nenhuma comanda fechada no período.</p>" : `
    <table>
      <tr><th>Data</th><th>Quantidade de Comandas</th><th>Receita</th></tr>
      ${dias.map(d=>`<tr><td>${new Date(d.data+"T12:00:00").toLocaleDateString("pt-BR",{day:'2-digit',month:'2-digit'})}</td><td>${d.count}</td><td>${money(d.total)}</td></tr>`).join("")}
    </table>`;

  return `
    <h2>Requinte Café</h2>
    <p><strong>Fechamento de Caixa</strong><br>${labelMes}</p>
    <h3>Resumo do caixa</h3>
    <table><tr><th>Forma de Pagamento</th><th>Receita Recebida</th></tr>${resumoPagHtml}</table>
    <p><strong>Receita total do mês: ${money(total)}</strong></p>
    <p>Quantidade de comandas fechadas: ${fechadas.length}</p>
    <p>Ticket médio: ${money(ticketMedio)}</p>
    <h3>Movimento por dia</h3>
    ${diasHtml}
  `;
}

function imprimirRelatorioAtivo(){
  if(!relatorioAtivo) return;
  if(relatorioAtivo.tipo==="mensal") gerarPdfMensal(relatorioAtivo.ano, relatorioAtivo.mes);
  else gerarPdfDiario(relatorioAtivo.data);
}

/* ================= GERAÇÃO DE PDF REAL (jsPDF) ================= */
function pdfDisponivel(){
  if(!(window.jspdf && window.jspdf.jsPDF)){
    showToast("Não foi possível carregar o gerador de PDF. Verifique sua conexão e tente novamente.");
    return false;
  }
  return true;
}
function novoDocPDF(){
  const { jsPDF } = window.jspdf;
  return new jsPDF({ unit:"pt", format:"a4" });
}
function pdfCabecalho(doc, linhaPeriodo){
  doc.setFont("helvetica","bold");
  doc.setFontSize(16);
  doc.text("REQUINTE CAFÉ", 40, 50);
  doc.setFontSize(12);
  doc.text("FECHAMENTO DE CAIXA", 40, 68);
  doc.setFont("helvetica","normal");
  doc.setFontSize(10);
  doc.text(linhaPeriodo, 40, 84);
  doc.setLineWidth(0.75);
  doc.line(40, 94, 555, 94);
  return 116;
}
function pdfQuebraPagina(doc, y){
  if(y > 780){ doc.addPage(); return 50; }
  return y;
}
function pdfResumoPagamento(doc, y, porPagamento){
  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text("Resumo por forma de pagamento", 40, y); y += 18;
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  PAYMENTS.forEach(p=>{
    y = pdfQuebraPagina(doc, y);
    doc.text(p, 40, y);
    doc.text(money(porPagamento[p]||0), 515, y, {align:"right"});
    y += 15;
  });
  return y + 10;
}

function gerarPdfDiario(dateStr){
  if(!pdfDisponivel()) return;
  const {fechadas, total, porPagamento} = dadosDoDia(dateStr);
  const dataFmt = new Date(dateStr+"T12:00:00").toLocaleDateString("pt-BR",{day:'2-digit',month:'2-digit',year:'numeric'});
  const doc = novoDocPDF();
  let y = pdfCabecalho(doc, "Data: "+dataFmt);

  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text("Quantidade de comandas fechadas: "+fechadas.length, 40, y); y += 16;
  doc.text("Faturamento total: "+money(total), 40, y); y += 24;

  y = pdfResumoPagamento(doc, y, porPagamento);

  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  y = pdfQuebraPagina(doc, y);
  doc.text("Movimentação do dia", 40, y); y += 18;
  doc.setFontSize(10);
  y = pdfQuebraPagina(doc, y);
  doc.text("Cliente", 40, y); doc.text("Valor", 340, y); doc.text("Forma de Pagamento", 420, y);
  y += 6; doc.line(40, y, 555, y); y += 14;
  doc.setFont("helvetica","normal");
  if(fechadas.length===0){
    doc.text("Nenhuma comanda fechada no período.", 40, y); y += 16;
  } else {
    fechadas.forEach(c=>{
      y = pdfQuebraPagina(doc, y);
      doc.text(String(c.cliente).slice(0,42), 40, y);
      doc.text(money(comandaTotal(c)), 340, y);
      doc.text(String(c.paymentMethod), 420, y);
      y += 15;
    });
  }

  const nomeArquivo = "Requinte_Cafe_Fechamento_Caixa_" + dateStr.split("-").reverse().join("-") + ".pdf";
  doc.save(nomeArquivo);
}

function gerarPdfMensal(ano, mes){
  if(!pdfDisponivel()) return;
  const {fechadas, total, porPagamento, dias, ticketMedio} = dadosDoMes(ano, mes);
  const labelMesRaw = new Date(ano, mes-1, 1).toLocaleDateString("pt-BR",{month:"long", year:"numeric"});
  const labelMes = labelMesRaw.charAt(0).toUpperCase()+labelMesRaw.slice(1);
  const doc = novoDocPDF();
  let y = pdfCabecalho(doc, labelMes);

  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text("Quantidade de comandas fechadas: "+fechadas.length, 40, y); y += 16;
  doc.text("Faturamento total: "+money(total), 40, y); y += 16;
  doc.text("Ticket médio: "+money(ticketMedio), 40, y); y += 24;

  y = pdfResumoPagamento(doc, y, porPagamento);

  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  y = pdfQuebraPagina(doc, y);
  doc.text("Movimento por dia", 40, y); y += 18;
  doc.setFontSize(10);
  y = pdfQuebraPagina(doc, y);
  doc.text("Data", 40, y); doc.text("Qtd. comandas", 220, y); doc.text("Faturamento", 400, y);
  y += 6; doc.line(40, y, 555, y); y += 14;
  doc.setFont("helvetica","normal");
  if(dias.length===0){
    doc.text("Nenhuma comanda fechada no período.", 40, y); y += 16;
  } else {
    dias.forEach(d=>{
      y = pdfQuebraPagina(doc, y);
      doc.text(new Date(d.data+"T12:00:00").toLocaleDateString("pt-BR",{day:'2-digit',month:'2-digit'}), 40, y);
      doc.text(String(d.count), 220, y);
      doc.text(money(d.total), 400, y);
      y += 15;
    });
  }

  const nomeArquivo = "Requinte_Cafe_Fechamento_Caixa_" + String(mes).padStart(2,"0") + "-" + ano + ".pdf";
  doc.save(nomeArquivo);
}

function refreshCartBar(){
  const cb = document.querySelector(".cart-bar");
  if(!cb) return;
  cb.querySelector(".cb-info").innerHTML = `${cartCount()} ${cartCount()===1?"item":"itens"}<br><span class="cb-total">${money(cartTotal())}</span>`;
  const btn = document.getElementById("abrirComandaBtn");
  btn.disabled = cartCount()===0 || novoCliente.trim()==="";
}
function focusClienteAfter(){
  const el = document.getElementById("clienteInput");
  if(el){ el.value = novoCliente; }
}

function openPaymentSheet(c){
  const sheet = document.getElementById("confirmSheet");
  sheet.innerHTML = `
    <div style="font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin-bottom:4px;color:var(--red-dark)">Fechar comanda de ${escapeHtml(c.cliente)}</div>
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px">Total: <strong>${money(comandaTotal(c))}</strong> — selecione a forma de pagamento</div>
    <div class="pay-grid" id="paySelectGrid">
      ${PAYMENTS.map(p=>`<button data-pay="${escapeAttr(p)}">${p}</button>`).join("")}
    </div>
    <button class="btn-block btn-secondary" id="payCancel">Cancelar</button>
  `;
  document.getElementById("confirmOverlay").classList.add("show");
  document.getElementById("payCancel").onclick = closeConfirm;
  sheet.querySelectorAll("[data-pay]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      c.status="fechada";
      c.paymentMethod = btn.dataset.pay;
      c.closedAt = new Date().toISOString();
      await saveData();
      closeConfirm();
      showToast("Comanda fechada · "+btn.dataset.pay);
      view="pedidos"; render();
    });
  });
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

loadData();
